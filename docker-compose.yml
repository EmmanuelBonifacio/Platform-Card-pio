services:
  postgres:
    image: postgres:15-alpine
    container_name: pc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform_cardapio
    ports:
      - "5434:5432"
    volumes:
      - pc_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform_cardapio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pc_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - pc_redis:/data

  minio:
    image: minio/minio:latest
    container_name: pc_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pc_minio:/data

volumes:
  pc_pg:
  pc_redis:
  pc_minio:
